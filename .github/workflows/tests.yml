name: tests

# Runs on all three platforms deliberately. The daemon lives on Linux today, but
# the suite is stdlib-only precisely so it also runs on Windows - which is where
# a future port is headed - and macOS, added cheaply (#69) as the fastest way to
# turn "probably fine, it's POSIX" into an actual answer: CI proving a change has
# not quietly broken another platform is the whole reason the other two are here.
on:
  # Long-lived branches only, so a feature branch does not get a push run AND a
  # pull_request run for the same commit.
  push:
    branches: [main]

  # Every pull request, whatever it targets.
  #
  # This list used to name branches, which created a chicken-and-egg trap:
  # GitHub evaluates a pull_request trigger using the workflow file on the BASE
  # branch, not the PR's own copy. So a PR opening against a branch that was not
  # yet in this list could not run CI - including the PR that would have added
  # it. #54 hit exactly that and had to be verified by hand instead.
  pull_request:
    branches: ['**']

  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 is what production runs; 3.12 catches anything the newer
        # interpreter tightens before it becomes a surprise.
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Optional dependency (see requirements-web.txt) - the daemon itself needs
      # nothing and runs fine without this. Installed here so the suite exercises
      # webserver.py's real Flask routes rather than always taking the
      # @skipUnless(webserver.HAVE_FLASK, ...) path: those routes had gone
      # untested in CI since the day they were added, on every PR, because
      # nothing here ever installed Flask.
      - name: Install the optional web dashboard dependency
        run: pip install -r requirements-web.txt

      - name: Put the identifier denylist in place
        # tests/forbidden_identifiers.py is not tracked (.gitignore). Where the
        # FORBIDDEN_IDENTIFIERS secret is set, it holds that file base64-encoded
        # and this writes it back, so the identifier sweep in
        # tests/test_no_personal_identifiers_ship.py runs. Where it is not - a
        # pull request from a fork, or a repository without the secret - this
        # does nothing and that test skips, saying the sweep did not run.
        #
        # Unless the repository says the sweep must run: with the
        # REQUIRE_IDENTIFIER_SWEEP repository variable set to anything, a run
        # without the secret FAILS here instead - a deleted or renamed secret
        # must not turn the sweep into a quiet skip. A pull request from a fork
        # still skips, since GitHub gives it no secrets at all; so does any
        # repository without the variable (a fork's own CI, the public one).
        #
        # Bash on all three runners (Git Bash on Windows), and the value only
        # ever reaches Python through the environment: it is never echoed, and
        # a failure reports the kind of error only, never a line of the file.
        shell: bash
        env:
          FORBIDDEN_IDENTIFIERS: ${{ secrets.FORBIDDEN_IDENTIFIERS }}
          REQUIRE_IDENTIFIER_SWEEP: ${{ vars.REQUIRE_IDENTIFIER_SWEEP }}
          FROM_A_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          python - <<'PY'
          import base64, binascii, os, sys
          value = "".join(os.environ.get("FORBIDDEN_IDENTIFIERS", "").split())
          if not value:
              if (os.environ.get("REQUIRE_IDENTIFIER_SWEEP", "").strip()
                      and os.environ.get("FROM_A_FORK") != "true"):
                  sys.exit("No FORBIDDEN_IDENTIFIERS secret, but REQUIRE_IDENTIFIER_SWEEP"
                           " is set: the identifier sweep must run here.")
              print("No FORBIDDEN_IDENTIFIERS secret here: the identifier sweep will skip.")
              sys.exit(0)
          try:
              data = base64.b64decode(value, validate=True)
          except (binascii.Error, ValueError) as err:
              sys.exit(f"FORBIDDEN_IDENTIFIERS is not valid base64 ({type(err).__name__})")
          path = os.path.join("tests", "forbidden_identifiers.py")
          with open(path, "wb") as handle:
              handle.write(data)
          sys.path.insert(0, os.getcwd())
          try:
              from tests.forbidden_identifiers import FORBIDDEN
          except BaseException as err:
              sys.exit(f"the decoded denylist does not import ({type(err).__name__})")
          if not isinstance(FORBIDDEN, dict) or not FORBIDDEN:
              sys.exit("the decoded denylist holds no FORBIDDEN entries")
          print("The identifier denylist is in place.")
          PY

      - name: Every module imports cleanly
        # Catches a syntax error or a bad import before the suite even starts.
        #
        # The list used to be written out here by hand, and had drifted: it named
        # 11 modules, preflight named 12, and the project had 14 - adminchat.py
        # and oserve.py were in neither. scripts/check_imports.py derives the list
        # from the filesystem instead, so a new module is covered the moment it
        # exists.
        run: python scripts/check_imports.py

      - name: Compile every source file
        run: python -m compileall -q .

      - name: Run the regression suite
        # Four processes at once, balanced by tests/module_durations.json and
        # reported as one run (#1146): the same tests and the same total as
        # `python -m unittest discover -s tests -t . -v`, in a third of the time.
        run: python scripts/run_tests_in_parallel.py -v
